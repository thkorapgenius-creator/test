<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Purger ses radiateurs</title>
    <style>
      /* Charte Soltys : Poppins, jaune #F9B533, gris #545454, bleu nuit #303642 */
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/poppins-600.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/poppins-700.woff2") format("woff2"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f5e6cc; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: radial-gradient(ellipse 120% 70% at 50% 46%, #fdf6ea 0%, #f7e9d1 55%, #efd8b2 100%);
        font-family: "Poppins", sans-serif; color: #303642;
      }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #txt { position: absolute; inset: 0; pointer-events: none; }
      .blk { position: absolute; left: 70px; right: 70px; text-align: center; display: none; text-wrap: balance; }
      .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
      .num { background: #f9b533; color: #303642; border-radius: 18px; padding: 0 14px; margin-right: 4px; }
      .titre { top: 330px; font-size: 92px; font-weight: 700; line-height: 1.12; letter-spacing: -1.5px; }
      .titre::after, #cover .ct::after { content: ""; display: block; width: 150px; height: 14px; border-radius: 7px; background: #f9b533; margin: 34px auto 0; }
      .haut { top: 300px; font-size: 56px; font-weight: 700; line-height: 1.3; letter-spacing: -0.5px; }
      .bas, .liste { bottom: 300px; }
      .card {
        display: inline-block; background: #ffffff; border-radius: 36px; padding: 26px 42px 30px; color: #303642;
        border-bottom: 10px solid #f9b533;
        box-shadow: 0 16px 34px rgba(48, 54, 66, 0.16); font-size: 44px; font-weight: 600; line-height: 1.32;
        transform-origin: 50% 100%;
      }
      .liste .card { text-align: left; font-size: 40px; padding: 28px 40px; }
      .row { display: flex; align-items: flex-start; gap: 22px; }
      .row + .row { margin-top: 18px; }
      .dot { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: #f9b533; margin-top: 15px; }
      /* couverture */
      #cover { position: absolute; inset: 0; display: none; }
      #cover .ct { text-wrap: balance; position: absolute; top: 330px; left: 60px; right: 60px; text-align: center; font-size: 104px; font-weight: 700; line-height: 1.1; letter-spacing: -2px; }
      /* jauge agrandie (étape 6) */
      #gauge { position: absolute; left: 0; top: 0; width: 400px; height: 400px; display: none; transform-origin: 50% 50%; }
    </style>
    <script>
      // HyperFrames : la page signale quand elle est prête, puis peint chaque image demandée par l'événement hf-seek.
      (function () {
        var resolve; var ready = new Promise(function (r) { resolve = r; });
        window.__reelReady = resolve;
        window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady.reel = ready;
        window.__seekTime = 0;
        window.addEventListener('hf-seek', function (e) {
          var t = Math.max(0, Number(e.detail && e.detail.time) || 0);
          window.__seekTime = t;
          var p = ready.then(function () { window.renderAt(t); });
          if (e.detail && typeof e.detail.waitUntil === 'function') e.detail.waitUntil(p);
        });
      })();
    </script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js", "three/addons/": "./assets/vendor/addons/" } }
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="59.5" data-fps="30" data-no-timeline data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <svg id="gauge" viewBox="0 0 400 400"></svg>
      <div id="txt"></div>
      <div id="cover"><div class="ct"></div></div>
    </div>
    <script src="contenu.js"></script>
    <script src="src/text.js"></script>
    <script type="module" src="src/scene.js"></script>
  </body>
</html>
